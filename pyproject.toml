[project]
name = "revit-mcp"
version = "0.1.0"
description = "Autodesk Revit integration for Claude AI via Model Context Protocol"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "mcp-server-fastmcp>=0.0.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
revit-mcp = "revit_mcp.main:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
dev-dependencies = [
    "pytest~=7.0",
    "pre-commit~=3.0",
    "ruff~=0.1.0",
] 